<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floorplan Team Editor, CTICC 2, 5 and 6 May 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B3A66;--teal:#0E8094;--green:#84C341;--orange:#E2703A;--amber:#F2B233;--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font,Montserrat),system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
header{display:flex;align-items:center;gap:18px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
header img{height:38px}header img.cem{height:56px;margin:-8px 0}
header h1{font-size:18px;margin:0;color:var(--navy);font-weight:800}
header p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.hdr-right{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
#who{margin-bottom:3px}#who a{color:var(--navy);font-weight:700}
.login{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.55);display:flex;align-items:center;justify-content:center}
.lbox{background:#fff;border-radius:14px;padding:26px;width:320px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbox h2{margin:0 0 6px;color:var(--navy);font-size:20px}.lbox p{margin:0 0 14px;color:var(--muted);font-size:13px}
.lbox input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;margin-bottom:10px}
.lbox .btn{width:100%}.lbox .msg{min-height:16px;margin-top:8px}
.conn{display:inline-block;width:8px;height:8px;border-radius:50%;background:#98a2b3;margin-right:6px;vertical-align:middle}
.conn.ok{background:#4caf50}.conn.err{background:#e5484d}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
.group{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px}
.chip{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1.5px solid var(--navy)}
.search{flex:1;min-width:180px;max-width:300px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:700;color:var(--navy)}
.wrap{display:flex;height:calc(100vh - 128px);min-height:560px}
.map{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff;margin:14px;border-radius:14px;border:1px solid var(--line)}
.stagewrap{flex:1;min-height:0;position:relative}
.map svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#scene3d{position:absolute;inset:0;display:none;touch-action:none}
#scene3d canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.load3d{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:14px;font-weight:600;background:#f1f4f8}
.map.is3d svg{display:none}.map.is3d #scene3d{display:block}
.map:not(.is3d) .load3d{display:none!important}
.hint3d{position:absolute;left:14px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px;display:none;pointer-events:none}
.map.is3d .hint3d{display:block}
.recentre{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;font:600 13px inherit;font-family:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(16,24,40,.12);cursor:pointer}
.recentre:hover{background:#f2f4f7}
.card .desc{white-space:pre-line;font-size:13px;line-height:1.55;color:var(--ink);margin-top:10px}
.card .web{display:block;text-align:center;text-decoration:none;margin-top:12px}
.card .home3d{display:none;margin-top:10px;width:100%}
.map.is3d .card .home3d{display:block}
.card .clogo.big{height:90px;border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:12px}
.map svg.drag{cursor:grabbing}
.el{cursor:pointer}
.el .box{transition:fill .15s,stroke .15s}
.el:hover .box{stroke:var(--green)!important;stroke-width:7}
.el.sel .box{stroke:var(--green)!important;stroke-width:9}
.el.dim{opacity:.18}
.el.hit .box{stroke:var(--green)!important;stroke-width:9;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{stroke-opacity:1}to{stroke-opacity:.35}}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;line-height:1.45;box-shadow:0 6px 18px rgba(16,24,40,.25);display:none;max-width:240px;z-index:5}
.tip b{font-size:13px}
.legend{border-top:1px solid var(--line);padding:10px 16px;justify-content:center;font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--muted)}
.banner{background:#fff4e5;color:#8a4b00;border-bottom:1px solid #f5d7a8;padding:10px 22px;font-size:13px;font-weight:600;display:none}
aside{width:360px;flex-shrink:0;margin:14px 14px 14px 0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;padding:18px}
aside h2{margin:0 0 4px;font-size:22px;color:var(--navy);font-weight:800}
aside h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.3px}
.b-ca{background:#e3eef3;color:var(--navy)}.b-cem{background:#fbe3d8;color:#a8461b}.b-sh{background:#eef1f4;color:var(--muted)}
.b-available{background:#e8f5dc;color:#3f6f12}.b-reserved{background:#fdf0cf;color:#8a5a00}.b-sold{background:var(--navy);color:#fff}
.stats{display:grid;gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:22px;font-weight:800;color:var(--navy);margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:#eef1f4;overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input.f,select.f,textarea.f{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff}
textarea.f{min-height:80px;resize:vertical}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on[data-s=available]{border-color:#7cb342;background:#e8f5dc;color:#3f6f12}
.seg button.on[data-s=reserved]{border-color:var(--amber);background:#fdf0cf;color:#8a5a00}
.seg button.on[data-s=sold]{border-color:var(--navy);background:var(--navy);color:#fff}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--navy);font-size:13px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);flex:1}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px}
.meta{font-size:13px;color:var(--muted);margin-top:6px}
.back{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:0;margin-bottom:12px;font-size:13px}
.info{margin-top:16px;font-size:14px;line-height:1.6}
.info b{color:var(--navy)}
.dot.lg{background:#fff;position:relative}.dot.lg::after{content:'';position:absolute;left:2px;right:2px;top:3px;bottom:3px;background:#98a2b3;border-radius:1px}
.view aside{display:none}.view .hdr-right{display:none}.view .map{margin-right:14px}
.logo-box{margin-top:8px;border:1.5px dashed var(--line);border-radius:10px;height:110px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.logo-box img{max-width:90%;max-height:90%}
.logo-box span{font-size:12px;color:#98a2b3}
.logo-actions{display:flex;gap:8px;margin-top:8px}
.logo-actions label{margin:0;flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:9px;cursor:pointer;color:var(--navy);font-size:13px}
.tip .tl{background:#fff;border-radius:6px;padding:6px 8px;margin-top:7px;display:flex;justify-content:center;align-items:center;height:56px}.tip .tl img{max-width:190px;max-height:44px}
.tier-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;font-size:14px}
.tier-row button{border:0;background:none;color:#98a2b3;font-size:18px;cursor:pointer;line-height:1}.tier-row button:hover{color:#e5484d}
.tier-add{display:flex;gap:6px;margin-top:8px}.tier-add input{flex:1}
.card .clogo{margin-top:10px;height:70px;display:flex;align-items:center;justify-content:center}.card .clogo img{max-width:100%;max-height:100%}
.card{position:absolute;top:14px;right:14px;width:300px;max-height:calc(100% - 28px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.16);padding:14px 16px;z-index:6;display:none}
.card h2{margin:0 0 6px;font-size:18px;color:var(--navy);font-weight:800}
.card .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.fmodal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.fmodal.on{display:flex}
.fbox{background:#fff;border-radius:14px;width:100%;max-width:680px;height:100%;max-height:860px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(16,24,40,.3)}
.fhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.fhead b{font-size:16px;color:var(--navy);flex:1}
.fhead a{font-size:12px;color:var(--muted)}
.fhead button{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.fbody{flex:1;position:relative;background:#fff}
.fbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fbody .fload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
@media (max-width:600px){.fmodal{padding:0}.fbox{border-radius:0;max-height:none}}
.btn.book{display:block;text-align:center;text-decoration:none;margin-top:14px;background:var(--navy);color:#fff;border-color:var(--navy)}
.zoom .pdf{width:auto;padding:0 12px;font-size:13px}
.zoom .enq{background:#84C341;color:#1B3A66;border-color:#84C341;font-weight:800}
.zoom .enq:hover{background:#76b136;border-color:#76b136}
.brand-cem .zoom .enq{background:#DA632B;color:#fff;border-color:#DA632B}
.brand-cem .zoom .enq:hover{background:#c4561f;border-color:#c4561f}
.print-foot{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;height:auto}
  .toolbar,.banner,aside,.tip,.card,.zoom,.hdr-right,.fmodal{display:none!important}
  header{border:0;padding:1mm 0 4mm;align-items:center}
  header img{height:30px}
  header img.cem{height:46px;margin:0}
  .wrap{display:block;height:auto;min-height:0}
  .map{display:block;margin:0;border:0;border-radius:0;height:auto;overflow:visible}
  .stagewrap{flex:none;height:auto}
  .map svg,.map.is3d svg{display:block!important;width:100%;height:158mm;cursor:default}
  #scene3d,.load3d,.hint3d,.recentre{display:none!important}
  .legend{border-top:0;padding:2mm 0 0}
  .print-foot{display:block;text-align:center;font-size:9px;color:#667085;margin-top:1mm}
}
@media (max-width:900px){.wrap{flex-direction:column;height:auto}.map{height:70vh;margin:10px}aside{width:auto;margin:0 10px 10px}.zoom{margin-left:0}.hdr-right{display:none}}
</style>
</head>

function shrinkLogo(file){
  return new Promise((resolve, reject)=>{
    const rd = new FileReader();
    rd.onerror = reject;
    rd.onload = ()=>{ const img = new Image(); img.onerror = reject; img.onload = ()=>{
      let size = 260, out = '';
      for (let i = 0; i < 8; i++){
        const w0 = img.naturalWidth || 300, h0 = img.naturalHeight || 300, k = Math.min(1, size / Math.max(w0, h0));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0*k)); c.height = Math.max(1, Math.round(h0*k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/png');
        if (out.length > 45000){ const wb = c.toDataURL('image/webp', 0.9); if (wb.startsWith('data:image/webp') && wb.length < out.length) out = wb; }
        if (out.length <= 45000) return resolve(out);
        size = Math.round(size * 0.8);
      }
      reject(new Error('too large'));
    }; img.src = rd.result; };
    rd.readAsDataURL(file);
  });
}

/* ---------- Save as PDF: builds a real A4 landscape PDF in the browser and downloads it ---------- */
function pdfBytes(img, imgW, imgH, filter){
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = p=>{ const b = typeof p === 'string' ? enc.encode(p) : p; parts.push(b); len += b.length; };
  const PW = 842, PH = 595, content = 'q ' + PW + ' 0 0 ' + PH + ' 0 0 cm /Im0 Do Q';
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (n, body)=>{ offs[n] = len; push(n + ' 0 obj\n'); body(); push('\nendobj\n'); };
  obj(1, ()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, ()=>push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, ()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>'));
  obj(4, ()=>push('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream'));
  obj(5, ()=>{ push('<< /Type /XObject /Subtype /Image /Width ' + imgW + ' /Height ' + imgH + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /' + filter + ' /Length ' + img.length + ' >>\nstream\n'); push(img); push('\nendstream'); });
  const xref = len;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let n = 1; n <= 5; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  const out = new Uint8Array(len); let p = 0; parts.forEach(b=>{ out.set(b, p); p += b.length; });
  return out;
}
// lossless page image: raw RGB squeezed with the browser's built-in deflate (PDF FlateDecode)
async function flateRGB(cv){
  const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, n = cv.width * cv.height, rgb = new Uint8Array(n * 3);
  for (let i = 0, j = 0; i < n; i++, j += 4){ rgb[i * 3] = d[j]; rgb[i * 3 + 1] = d[j + 1]; rgb[i * 3 + 2] = d[j + 2]; }
  const stream = new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function loadImg(src){ return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; }); }
async function savePDF(){

    const cv = document.createElement('canvas'); cv.width = W * SS; cv.height = H * SS;
    const g = cv.getContext('2d'); g.scale(SS, SS); g.imageSmoothingQuality = 'high';
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    const font = getComputedStyle(document.body).fontFamily;
    // header: logos, title and date line
    let hx = M; const hy = M, hh = 90;
    for (const im of document.querySelectorAll('header img')){
      try { const i = await loadImg(im.src); const h = im.classList.contains('cem') ? hh * 1.25 : hh, w = i.width * h / i.height; g.drawImage(i, hx, hy + (hh - h) / 2, w, h); hx += w + 40; } catch(e){}
    }

    g.font = '800 54px ' + font; g.fillText(document.querySelector('header h1').textContent, hx + 10, hy + 50);
    g.fillStyle = '#667085'; g.font = '500 30px ' + font; g.fillText(document.querySelector('header p').textContent, hx + 10, hy + 92);
    // the plan
    const svg = document.getElementById('svg').cloneNode(true);
    svg.setAttribute('viewBox', VB0.x + ' ' + VB0.y + ' ' + VB0.w + ' ' + VB0.h);
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); svg.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    const top = hy + hh + 40, foot = 120, aw = W - 2 * M, ah = H - top - foot;
    const k = Math.min(aw / VB0.w, ah / VB0.h), pw = Math.round(VB0.w * k), ph = Math.round(VB0.h * k);
    svg.setAttribute('width', pw * SS); svg.setAttribute('height', ph * SS);
    const st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    st.textContent = 'text{font-family:' + font.replace(/"/g, "'") + ',Arial,sans-serif}';
    svg.insertBefore(st, svg.firstChild);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml;charset=utf-8' }));
    const plan = await loadImg(url); URL.revokeObjectURL(url);
    g.drawImage(plan, M + (aw - pw) / 2, top, pw, ph);
    // key and footer
    let lx = M + (aw - pw) / 2; const ly = top + ph + 45;
    g.font = '600 28px ' + font; g.textBaseline = 'middle';

        g.strokeStyle = cs.borderTopColor || '#1B3A66'; g.lineWidth = 3; g.strokeRect(lx, ly - 13, 26, 26); lx += 36;
      });
      g.fillStyle = '#1B3A66'; g.fillText(sp.textContent.trim(), lx + 4, ly); lx += g.measureText(sp.textContent.trim()).width + 60;
    });

    if (window.CompressionStream){ data = await flateRGB(cv); filter = 'FlateDecode'; }
    else { const b = atob(cv.toDataURL('image/jpeg', 0.97).split(',')[1]); data = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) data[i] = b.charCodeAt(i); filter = 'DCTDecode'; }
    const blob = new Blob([pdfBytes(data, cv.width, cv.height, filter)], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = (document.title || 'Floorplan').replace(/[\\/:*?"<>|]/g, '') + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  } catch(e){
    try { window.print(); } catch(_){}                    // fallback: the browser's own print to PDF

const KEYS = new Set();

function moveKeys3D(){
  const cam = T3.camera, tg = T3.controls.target;
  const f = new THREE.Vector3(tg.x - cam.position.x, 0, tg.z - cam.position.z);
  if (f.lengthSq() < 1e-6) f.set(0, 0, -1);
  f.normalize();
  const r = new THREE.Vector3(-f.z, 0, f.x);
  const sp = Math.max(0.06, cam.position.distanceTo(tg) * 0.014);
  const d = new THREE.Vector3();
  if (KEYS.has('ArrowUp')) d.add(f); if (KEYS.has('ArrowDown')) d.sub(f);
  if (KEYS.has('ArrowRight')) d.add(r); if (KEYS.has('ArrowLeft')) d.sub(r);
  if (!d.lengthSq()) return;
  d.normalize().multiplyScalar(sp);
  const nx = Math.max(-34, Math.min(34, tg.x + d.x)) - tg.x, nz = Math.max(-30, Math.min(30, tg.z + d.z)) - tg.z;
  cam.position.x += nx; cam.position.z += nz; tg.x += nx; tg.z += nz;
}

// venue shell: solid walls north and west, glass facades south and east, and a ceiling; walls facing the camera hide themselves

  const x0 = W3(75), x1 = W3(1966), z0 = D3(63), z1 = D3(1681), Hh = 8.5, fw = x1 - x0, fd = z1 - z0;
  const wall = M3(0xd7dade, { roughness: 0.9 }), mull = M3(0x2b2f35, { roughness: 0.4, metalness: 0.6 });
  const glass = new THREE.MeshStandardMaterial({ color: 0xbfd9e6, roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.22, depthWrite: false });
  T3.walls = [];
  const solid = (cx, cz, w, d, n)=>{ const g = new THREE.Group(); bx(w, Hh, d, wall, cx, Hh / 2, cz, g); S.add(g); T3.walls.push({ g, c: new THREE.Vector3(cx, 0, cz), n }); };
  const facade = (cx, cz, len, alongX, n)=>{
    const g = new THREE.Group(); S.add(g);
    const pane = bx(alongX ? len : 0.03, Hh, alongX ? 0.03 : len, glass, cx, Hh / 2, cz, g, false); pane.receiveShadow = false;
    const k = Math.round(len / 2.6);
    for (let i = 0; i <= k; i++){ const o = -len / 2 + i * len / k; bx(alongX ? 0.09 : 0.14, Hh, alongX ? 0.14 : 0.09, mull, alongX ? cx + o : cx, Hh / 2, alongX ? cz : cz + o, g, false); }
    [0.05, 2.6, 5.2, Hh - 0.05].forEach(h=>bx(alongX ? len : 0.12, 0.1, alongX ? 0.12 : len, mull, cx, h, cz, g, false));
    T3.walls.push({ g, c: new THREE.Vector3(cx, 0, cz), n });
  };
  // the walls themselves come from buildArch3D, the same architecture as the standard view
  const ct = ceilingTexture(); ct.repeat.set(fw / 6, fd / 6);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(fw, fd), new THREE.MeshStandardMaterial({ map: ct, roughness: 0.9, emissive: 0xffffff, emissiveMap: ct, emissiveIntensity: 0.25 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set((x0 + x1) / 2, Hh, (z0 + z1) / 2); S.add(ceil);
  T3.ceiling = { m: ceil, x0, x1, z0, z1, h: Hh };
}
function updateShell(){
  if (!T3.walls) return;
  const cp = T3.camera.position, v = new THREE.Vector3();
  T3.walls.forEach(w=>{ v.set(cp.x - w.c.x, 0, cp.z - w.c.z); w.g.visible = v.dot(w.n) < 0; });
  const c = T3.ceiling; c.m.visible = cp.y < c.h - 0.3 && cp.x > c.x0 && cp.x < c.x1 && cp.z > c.z0 && cp.z < c.z1;
}

function room(rect, h, doorSide, label, mat, parent, labelCol){
  const x0 = W3(rect.x), z0 = D3(rect.y), w = rect.w * SC3, d = rect.h * SC3, t = 0.12, dw = 1.8;
  const cx = x0 + w / 2, cz = z0 + d / 2;
  const seg = (side)=>{
    const horiz = side === 'n' || side === 's';
    const len = horiz ? w : d;
    const fx = side === 'w' ? x0 + t / 2 : side === 'e' ? x0 + w - t / 2 : cx;
    const fz = side === 'n' ? z0 + t / 2 : side === 's' ? z0 + d - t / 2 : cz;
    if (side !== doorSide){ bx(horiz ? len : t, h, horiz ? t : len, mat, fx, h / 2, fz, parent); return; }
    const part = (len - dw) / 2;
    if (horiz){
      bx(part, h, t, mat, x0 + part / 2, h / 2, fz, parent); bx(part, h, t, mat, x0 + w - part / 2, h / 2, fz, parent);
      if (h > 2.4) bx(dw, h - 2.2, t, labelCol ? M3(labelCol, { toneMapped: false }) : mat, cx, 2.2 + (h - 2.2) / 2, fz, parent);
    } else {
      bx(t, h, part, mat, fx, h / 2, z0 + part / 2, parent); bx(t, h, part, mat, fx, h / 2, z0 + d - part / 2, parent);
      if (h > 2.4) bx(t, h - 2.2, dw, labelCol ? M3(labelCol, { toneMapped: false }) : mat, fx, 2.2 + (h - 2.2) / 2, cz, parent);
    }
  };
  ['n', 's', 'e', 'w'].forEach(seg);
  if (label){
    const hex = labelCol ? '#' + labelCol.toString(16).padStart(6, '0') : '#ffffff';
    const tex = textTexture([{ text: label, size: 64, color: labelCol ? '#ffffff' : '#1B3A66' }], 1024, 160, { bg: hex });
    const sw = Math.min(w, d) * 0.45, sh = sw * 160 / 1024, sy = h > 2.4 ? 2.2 + (h - 2.2) / 2 : h - sh / 2 - 0.05;
    const o = { mat: { toneMapped: false } };
    if (doorSide === 'e') plane(sw, sh, tex, x0 + w + 0.012, sy, cz, Math.PI / 2, parent, o);
    if (doorSide === 'w') plane(sw, sh, tex, x0 - 0.012, sy, cz, -Math.PI / 2, parent, o);
    if (doorSide === 's') plane(sw, sh, tex, cx, sy, z0 + d + 0.012, 0, parent, o);
    if (doorSide === 'n') plane(sw, sh, tex, cx, sy, z0 - 0.012, Math.PI, parent, o);
  }
}

const STAGE_THEME = {
  ca:  { accent: 0x2A8E99, accent2: 0x71B553, chair: 0x2A8E99, chair2: 0x71B553, logoKey: 'CA' },   // green blending to blue

function stageLogos(key){

// the printed stage graphic, cropped to fill the wall
function backdropTexture(src, cw, ch){
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, cw, ch);
  const t = texFrom(c);
  const img = new Image();
  img.onload = ()=>{
    const k = Math.max(cw / img.width, ch / img.height), w = img.width * k, h = img.height * k;
    g.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h); t.needsUpdate = true;
  };

  return t;
}
// clear acrylic piece with visible edges

  e.scale.set(w, h, d); e.position.set(x, y, z); parent.add(e);

function stageArea(rect, themeKey, side, parent){
  const th = STAGE_THEME[themeKey], L = stageLogos(th.logoKey);
  const G = new THREE.Group(); parent.add(G);
  G.position.set(W3(rect.x + rect.w / 2), 0, D3(rect.y + rect.h / 2));
  G.rotation.y = side === 'w' ? Math.PI / 2 : -Math.PI / 2;   // local +z faces into the hall
  const W = rect.h * SC3, D = rect.w * SC3;                     // local width runs along the wall
  const back = -D / 2 + 0.25;
  const accent = new THREE.MeshBasicMaterial({ color: th.accent, toneMapped: false });
  const top = M3(0x4a4e55, { roughness: 0.75 });
  const velvet = M3(th.chair, { roughness: 0.9, toneMapped: false }), velvet2 = th.chair2 ? M3(th.chair2, { roughness: 0.9, toneMapped: false }) : velvet;
  // every stage is the same size, and the backdrop matches the artwork's shape so nothing is cropped
  const pw = Math.min(W * 0.86, 8.6), bw = pw, bh = bw * 941 / 1672, pd = 3.4, ph = 0.45;
  // backdrop: frame from the floor, artwork starting level with the stage top
  bx(bw + 0.2, ph + bh + 0.1, 0.25, T3.mat.frame, 0, (ph + bh + 0.1) / 2, back, G);
  const btex = backdropTexture(L.bd, 1672, 941);
  plane(bw, bh, btex, 0, ph + bh / 2, back + 0.13, 0, G,
    { mat: { emissive: 0xffffff, emissiveMap: btex, emissiveIntensity: 0.3, roughness: 0.6 } });
  // platform: grey top, brand colour around it, plus a step
  const pz = back + 0.15 + pd / 2;
  if (th.accent2){
    // stage wrap: green on the left (as the audience sees it) blending to blue on the right, meeting at the front middle by the steps
    const hex = c=>'#' + c.toString(16).padStart(6, '0');
    const gc = document.createElement('canvas'); gc.width = 1024; gc.height = 8;
    const gg = gc.getContext('2d'), gr = gg.createLinearGradient(0, 0, 1024, 0);
    gr.addColorStop(0, hex(th.accent2)); gr.addColorStop(0.3, hex(th.accent2)); gr.addColorStop(0.7, hex(th.accent)); gr.addColorStop(1, hex(th.accent));
    gg.fillStyle = gr; gg.fillRect(0, 0, 1024, 8);
    const gt = texFrom(gc);
    const fm = new THREE.MeshBasicMaterial({ map: gt, toneMapped: false });
    const green = new THREE.MeshBasicMaterial({ color: th.accent2, toneMapped: false });
    bx(pw, ph - 0.04, pd, accent, 0, (ph - 0.04) / 2, pz, G);
    const front = new THREE.Mesh(T3.geo.plane, fm); front.scale.set(pw, ph - 0.04, 1); front.position.set(0, (ph - 0.04) / 2, pz + pd / 2 + 0.004); G.add(front);
    const left = new THREE.Mesh(T3.geo.plane, green); left.scale.set(pd, ph - 0.04, 1); left.position.set(-pw / 2 - 0.004, (ph - 0.04) / 2, pz); left.rotation.y = -Math.PI / 2; G.add(left);
    // step in the middle, carrying the blend
    const st = gt.clone(); st.needsUpdate = true; st.repeat.set(1.4 / pw, 1); st.offset.set(0.5 - 0.7 / pw, 0);
    bx(1.4, ph / 2, 0.45, new THREE.MeshBasicMaterial({ color: 0x4ea276, toneMapped: false }), 0, ph / 4, pz + pd / 2 + 0.22, G);
    const sf = new THREE.Mesh(T3.geo.plane, new THREE.MeshBasicMaterial({ map: st, toneMapped: false })); sf.scale.set(1.4, ph / 2, 1); sf.position.set(0, ph / 4, pz + pd / 2 + 0.454); G.add(sf);
  } else {
    bx(pw, ph - 0.04, pd, accent, 0, (ph - 0.04) / 2, pz, G);
    bx(1.4, ph / 2, 0.45, accent, 0, ph / 4, pz + pd / 2 + 0.22, G);
  }
  bx(pw + 0.03, 0.04, pd + 0.03, top, 0, ph - 0.02, pz, G);
  bx(1.42, 0.02, 0.47, top, 0, ph / 2 + 0.01, pz + pd / 2 + 0.22, G);
  // panel: armchairs with plinths and water between them
  const S1 = new THREE.Group(); S1.position.y = ph; G.add(S1);
  const n = pw > 9 ? 5 : 4, gap = Math.min(1.25, (pw - 2.4) / (n - 0.2));
  const z1 = back + 1.75;
  for (let i = 0; i < n; i++){
    const x = (i - (n - 1) / 2) * gap - 0.5;
    tubChair(S1, x, z1 + Math.abs(i - (n - 1) / 2) * 0.12, 0, (th.chair2 && i < n / 2) ? velvet2 : velvet);
    if (i < n - 1 && i % 2 === 0) plinth(S1, x + gap / 2, z1 - 0.15, L.c);
  }
  podium(S1, pw / 2 - 0.75, z1 + 0.35, L.c);
  // audience, black banquet chairs facing the stage with a centre aisle
  if (!T3.mat.banquet) T3.mat.banquet = keepGrey(M3(0x1e2126, { roughness: 0.6 }));
  const chairs = [];
  const zStart = pz + pd / 2 + 1.4, zEnd = D / 2 - 0.8;
  const usable = W - 2.2, colGap = 0.62, cols = Math.max(4, Math.floor((usable - 1.2) / colGap));
  for (let zr = zStart; zr <= zEnd; zr += 0.95){
    for (let c = 0; c < cols; c++){
      const half = c >= cols / 2 ? 1 : 0;
      chairs.push({ x: -((cols - 1) * colGap + 1.2) / 2 + c * colGap + half * 1.2, z: zr, r: Math.PI });
    }
  }
  addChairs(chairs, G, T3.mat.banquet);
  addHeadphones(chairs, G);
}

// SEDFA feature wall (white logo half, gold half), lounge, and white pavilion cubicles with bar tables
function sedfaWall(cw, ch){
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d'); const half = cw * 0.46;
  g.fillStyle = '#f7f5f0'; g.fillRect(0, 0, half, ch);
  const gr = g.createLinearGradient(half, 0, cw, ch); gr.addColorStop(0, '#b8964f'); gr.addColorStop(0.5, '#6e5a33'); gr.addColorStop(1, '#2b2418');
  g.fillStyle = gr; g.fillRect(half, 0, cw - half, ch);
  let seed = 3; const rnd = ()=>{ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 0; i < 160; i++){ const x = half + rnd() * (cw - half), h = ch * (0.15 + rnd() * 0.5); g.fillStyle = 'rgba(255,226,160,' + (0.08 + rnd() * 0.25) + ')'; g.fillRect(x, ch - h, 2, h); g.beginPath(); g.arc(x + 1, ch - h, 3, 0, 7); g.fill(); }
  g.strokeStyle = '#d4b46a'; g.lineWidth = ch * 0.07; g.beginPath(); g.arc(cw * 0.86, ch * 0.5, ch * 0.32, -1.2, 2.3); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const cols = ['#c9a24b', '#e05b3d', '#c9a24b', '#3f9a4a'];
  cols.forEach((col, i)=>{ g.fillStyle = col; g.beginPath(); g.arc(half * (0.3 + i * 0.13), ch * 0.3, ch * 0.035, 0, 7); g.fill(); });
  g.fillStyle = '#c9a24b'; g.font = '800 ' + Math.round(ch * 0.2) + 'px Montserrat, sans-serif'; g.fillText('SEDFA', half / 2, ch * 0.55);
  g.fillStyle = '#7a3e2a'; g.font = '600 ' + Math.round(ch * 0.042) + 'px Montserrat, sans-serif';
  g.fillText('SMALL ENTERPRISE DEVELOPMENT', half / 2, ch * 0.7); g.fillText('AND FINANCE AGENCY', half / 2, ch * 0.76);
  g.fillStyle = '#ffffff'; g.textAlign = 'left'; g.font = '700 ' + Math.round(ch * 0.065) + 'px Montserrat, sans-serif';
  g.fillText('Digital Tech MSME', half + cw * 0.05, ch * 0.28); g.fillText('Pavilion', half + cw * 0.05, ch * 0.37);
  return texFrom(c);
}

// Marketplace Theatre: black back wall with slatted timber pillars, screen, acrylic podium,

// printed registration graphic: brand gradient, white logo panel and REGISTRATION
function regGraphic(zone, cw, ch, logo){
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d'); const cem = zone === 'cem';
  const font = cem ? '"Open Sans", sans-serif' : 'Montserrat, sans-serif';
  const paint = img=>{
    // white background with the event's coloured lines
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, cw, ch);
    const c1 = cem ? '#DB612B' : '#84C341', c2 = cem ? '#25345c' : '#1B3A66', c3 = cem ? '#f2a27c' : '#0E8094';
    const band = (x0, w, col, a)=>{ g.globalAlpha = a; g.fillStyle = col; g.beginPath(); g.moveTo(cw * x0, ch); g.lineTo(cw * (x0 + 0.12), 0); g.lineTo(cw * (x0 + 0.12 + w), 0); g.lineTo(cw * (x0 + w), ch); g.fill(); };
    band(0.74, 0.06, c2, 0.95); band(0.82, 0.025, c1, 0.95); band(0.86, 0.14, c3, 0.25); band(-0.1, 0.03, c1, 0.9); band(-0.05, 0.012, c2, 0.8);
    g.globalAlpha = 1; g.fillStyle = c1; g.fillRect(0, ch - ch * 0.035, cw, ch * 0.035);
    const pw = Math.min(cw * 0.3, ch * 1.6), ph = ch * 0.62, px = cw * 0.06, py = (ch - ph) / 2;
    if (img){ const k = Math.min(pw * 0.9 / img.width, ph * 0.85 / img.height); const w = img.width * k, h = img.height * k; g.drawImage(img, px + (pw - w) / 2, py + (ph - h) / 2, w, h); }
    g.fillStyle = c2; g.textAlign = 'left'; g.textBaseline = 'middle';
    let fs = Math.round(ch * 0.3); g.font = '800 ' + fs + 'px ' + font;
    while (g.measureText('REGISTRATION').width > cw * 0.42 && fs > 10){ fs -= 4; g.font = '800 ' + fs + 'px ' + font; }
    g.fillText('REGISTRATION', px + pw + cw * 0.03, ch / 2);
  };
  paint(null);
  const t = texFrom(c);
  const img = new Image(); img.onload = ()=>{ paint(img); t.needsUpdate = true; }; img.src = logo;
  return t;
}

function hasStand(zone, x, y){ return EL.some(o=>o.kind === 'stand' && o.zone === zone && Math.abs(o.x - x) < 4 && Math.abs(o.y - y) < 4); }
function backSide(zone, x, y, w, h){
  const below = hasStand(zone, x, y + h), above = hasStand(zone, x, y - 89);
  if (below && !above) return 's';
  if (above && !below) return 'n';
  return y > 1400 ? 's' : 'n';
}
const RESERVED_LOGO = {};
function reservedLogo(zone){

  const c = document.createElement('canvas'); c.width = 900; c.height = 260;
  const g = c.getContext('2d');

// one see-through divider on each edge shared by two neighbouring stands in a row (never on an open end).
// Black frame, glass, and one solid block: the west stand's logo on its west face, the east stand's on its east face.
function buildDividers(){
  const units = T3.units.filter(u=>!u.island && Math.round(u.rect.h / 89) === 1 && (u.back === 'n' || u.back === 's'));
  const nb = (u, dx)=>units.find(v=>v !== u && v.zone === u.zone && v.back === u.back && Math.abs(v.rect.y - u.rect.y) < 4 &&
    (dx > 0 ? Math.abs(v.rect.x - (u.rect.x + u.rect.w)) < 4 : Math.abs(v.rect.x + v.rect.w - u.rect.x) < 4));
  const zb = u=>u.back === 'n' ? D3(u.rect.y) : D3(u.rect.y + u.rect.h), dir = u=>u.back === 'n' ? 1 : -1;
  units.forEach(u=>{
    const east = nb(u, 1), west = nb(u, -1);
    // neighbours share one divider on their common edge
    if (east && (u.booked || east.booked)) sharedDivider(W3(u.rect.x + u.rect.w), zb(u), dir(u), u.logo, east.logo, u.rect.h * SC3);
    // a stand with no neighbour gets its own divider on its right-hand side (as a visitor faces the back wall)
    if (!east && !west && u.booked){
      if (u.back === 'n') sharedDivider(W3(u.rect.x + u.rect.w), zb(u), 1, u.logo, '', u.rect.h * SC3);
      else sharedDivider(W3(u.rect.x), zb(u), -1, '', u.logo, u.rect.h * SC3);
    }
  });
}

  bx(f, H, f, T3.mat.frame, x, H / 2, z1 - dir * f / 2, P);                 // front post
  bx(f, f, L, T3.mat.frame, x, H - f / 2, zc, P);                          // top rail
  bx(f, f, L, T3.mat.frame, x, f / 2, zc, P);                              // bottom rail
  const glass = bx(0.012, H - 2 * f, L - f, T3.mat.glassWall, x, H / 2, zc - dir * f / 2, P, false); glass.receiveShadow = false;
  const bh = 0.9, by = 1.45, bd = L - 0.12;
  if (!T3.mat.pureWhite) T3.mat.pureWhite = M3(0xffffff, { roughness: 0.8, toneMapped: false });

function shellStand(parent, w, d, zone, logo, side, island){

function buildPlot(info){

  const r = info.rect, w = r.w * SC3, d = r.h * SC3;
  const cx = W3(r.x) + w / 2, cz = D3(r.y) + d / 2;
  const g = new THREE.Group(); g.position.set(cx, 0, cz); T3.booths.add(g);
  const booked = info.data.status !== 'available';
  const carpetMat = (booked ? T3.mat.carpetBooked : T3.mat.carpetFree).clone(); carpetMat.userData.own = true;
  const carpet = bx(w - 0.06, 0.04, d - 0.06, carpetMat, 0, 0.02, 0, g, false);
  // the stand body is built facing south (back wall at -z), then turned to its real back side
  const rot = info.back === 'n' ? 0 : info.back === 's' ? Math.PI : info.back === 'w' ? Math.PI / 2 : -Math.PI / 2;
  const body = new THREE.Group(); body.rotation.y = rot; g.add(body);

  // reserved with no logo yet: show "Reserved" where the logo goes

    {

  } else {
    plane(Math.min(w, d) * 0.8, Math.min(w, d) * 0.8, availableDecal(info.ids.length > 1 ? info.ids.join('+') : info.ids[0], info.zone), 0, 0.045, 0, 0, g, { transparent: true }).rotation.set(-Math.PI / 2, 0, 0);

  const hit = new THREE.Mesh(T3.geo.box, T3.mat.hit); hit.scale.set(w, 2.8, d); hit.position.set(0, 1.4, 0); hit.userData.id = info.ids[0]; g.add(hit); T3.hits.push(hit);

function rebuildBooths3D(force){

  T3.hits = []; T3.plots = {}; T3.units = []; T3.divs = new THREE.Group(); T3.booths.add(T3.divs);
  const done = new Set();
  EL.filter(e=>e.kind === 'stand').forEach(e=>{

    } else {

  if (!T3) return;
  if (animate) flyTo(HOME3D.pos, HOME3D.tgt);
  else { T3.camera.position.set(...HOME3D.pos); T3.controls.target.set(...HOME3D.tgt); T3.controls.update(); }
}
function frameZone3D(z){
  if (!T3) return;
  if (z === 'ca') flyTo([W3(615), 30, D3(1110) + 30], [W3(615), 0, D3(1110)]);
  else if (z === 'cem') flyTo([W3(1555), 30, D3(1110) + 30], [W3(1555), 0, D3(1110)]);
  else homeView3D(true);
}
function focus3D(id){
  const p = T3 && T3.plots[id]; if (!p) return;
  const dist = 6 + Math.max(p.w, p.d) * 0.9;
  flyTo([p.cx + p.front[0] * dist, 3.6 + Math.max(p.w, p.d) * 0.35, p.cz + p.front[1] * dist], [p.cx, 1.1, p.cz], 1000);
}
function zoom3D(f){
  if (!T3) return;
  const t = T3.controls.target, p = T3.camera.position;
  const v = p.clone().sub(t).multiplyScalar(f);
  const len = Math.min(140, Math.max(5, v.length())); v.setLength(len);
  flyTo([t.x + v.x, t.y + v.y, t.z + v.z], [t.x, t.y, t.z], 400);
}
// fade a whole stand (or the dividers) right down, so the filtered stands stand out
function setDim(group, on){
  if (!group || group.userData.dim === on) return;
  group.userData.dim = on;
  group.traverse(o=>{
    if (!o.material || o.material === T3.mat.hit) return;
    if (!o.userData.base){ if (!o.material.userData.own) o.material = o.material.clone(); o.userData.base = { t: o.material.transparent, o: o.material.opacity, dw: o.material.depthWrite, cs: o.castShadow }; }
    const b = o.userData.base;
    o.material.transparent = on ? true : b.t;
    o.material.opacity = on ? Math.min(b.o, 0.1) : b.o;
    o.material.depthWrite = on ? false : b.dw;
    o.material.needsUpdate = true;
    o.castShadow = on ? false : b.cs;
  });
}
function highlight3D(){
  if (!T3) return;
  const q = query.trim().toLowerCase();
  const filtering = statusF !== 'all' || !!q;
  const seen = new Set();
  Object.entries(T3.plots).forEach(([id, p])=>{
    if (seen.has(p)) return; seen.add(p);
    const e = BY[id];
    const hit = !q || p.ids.some(i=>i.toLowerCase() === q || (rec(i).exhibitor || '').toLowerCase().includes(q));
    const on = p.ids.includes(selected) || T3.hover === p || (filtering && matches(e) && hit);
    setDim(p.group, filtering && !(matches(e) && hit));
    p.carpet.emissive.setHex(on ? 0x84C341 : 0x000000).convertSRGBToLinear();
    p.carpet.emissiveIntensity = on ? 0.55 : 0;
  });
  setDim(T3.divs, filtering);
}

/* ---------- loop and events ---------- */
function resize3D(){
  if (!T3) return;
  const r = T3.el.getBoundingClientRect(); if (!r.width || !r.height) return;
  T3.renderer.setSize(r.width, r.height, false);
  T3.camera.aspect = r.width / r.height; T3.camera.updateProjectionMatrix();
}
function ease(t){ return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function loop3D(){
  if (!T3 || !T3.active || T3.looping) return;
  T3.looping = true;
  const step = ()=>{
    if (!T3.active){ T3.looping = false; return; }
    requestAnimationFrame(step);
    if (T3.anim){
      const a = T3.anim, k = Math.min(1, (performance.now() - a.t0) / a.dur), e = ease(k);
      T3.camera.position.lerpVectors(a.p0, a.p1, e); T3.controls.target.lerpVectors(a.t0v, a.t1, e);
      if (k >= 1) T3.anim = null;
    }
    if (KEYS.size) moveKeys3D();
    T3.controls.update();
    if (REAL) updateShell();
    const t = T3.controls.target; t.x = Math.max(-34, Math.min(34, t.x)); t.z = Math.max(-30, Math.min(30, t.z)); t.y = Math.max(0, Math.min(4, t.y));
    T3.renderer.render(T3.scene, T3.camera);
  };
  step();
}
function pick3D(ev){
  const r = T3.renderer.domElement.getBoundingClientRect();
  T3.ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1; T3.ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  T3.ray.setFromCamera(T3.ptr, T3.camera);
  const h = T3.ray.intersectObjects(T3.hits, false)[0];
  return h ? h.object.userData.id : null;
}

function init3D(){
  const el = document.getElementById('scene3d');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = REAL ? 0.95 : 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xE8EDF3); scene.fog = new THREE.Fog(0xE8EDF3, 140, 280);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.3, 600);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.09; controls.maxPolarAngle = 1.36; controls.minDistance = 4; controls.maxDistance = 140; controls.screenSpacePanning = false; controls.rotateSpeed = 0.7;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8f99a6, REAL ? 0.35 : 0.85));
  const sun = new THREE.DirectionalLight(0xfffaf2, 1.35); sun.position.set(-26, 48, 32); sun.castShadow = true;
  sun.shadow.mapSize.set(REAL ? 4096 : 2048, REAL ? 4096 : 2048); const sc = sun.shadow.camera; sc.left = -46; sc.right = 46; sc.top = 46; sc.bottom = -46; sc.near = 1; sc.far = 150; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xdfe8f5, 0.35); fill.position.set(30, 22, -26); scene.add(fill);
  T3 = { renderer, scene, camera, controls, el, active: true, hits: [], plots: {}, booths: new THREE.Group(), anim: null, hover: null, dataKey: '', ray: new THREE.Raycaster(), ptr: new THREE.Vector2() };
  T3.geo = { box: new THREE.BoxGeometry(1, 1, 1), cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 28), plane: new THREE.PlaneGeometry(1, 1) };
  T3.mat = {
    frame: M3(0x1d2026, { roughness: 0.5 }), white: M3(0xf5f6f8, { roughness: 0.55 }), chair: M3(0xffffff, { roughness: 0.4 }),
    metal: M3(0xaab0b7, { roughness: 0.35, metalness: 0.75 }), tv: M3(0x0a0c0f, { roughness: 0.12, metalness: 0.4 }), lamp: M3(0x2a2e34, { roughness: 0.4, metalness: 0.6 }),
    carpetBooked: M3(0x5c626a, { roughness: 1 }), carpetFree: M3(0xffffff, { roughness: 1 }), room: M3(0xffffff, { roughness: 0.9, toneMapped: false }),
    teal: M3(0x1A6E80, { roughness: 0.6 }), stage: M3(0x2b3038, { roughness: 0.7 }),
    hit: new THREE.MeshBasicMaterial({ visible: false })
  };
  const wp = document.createElement('canvas'); wp.width = 8; wp.height = 8; const wg = wp.getContext('2d'); wg.fillStyle = '#ffffff'; wg.fillRect(0, 0, 8, 8);
  T3.tex = { whitePanel: texFrom(wp) };
  if (REAL){
    realEnvironment(renderer, scene);
    T3.mat.metal.roughness = 0.22; T3.mat.metal.metalness = 1;
    T3.mat.white.roughness = 0.45; T3.mat.chair.roughness = 0.35;
    T3.mat.carpetBooked.color.setHex(0x5a5d63); T3.mat.carpetFree.color.setHex(0xeef0f2);
    T3.mat.frame.roughness = 0.35; T3.mat.frame.metalness = 0.3;
  }
  scene.add(T3.booths);
  buildStatic3D();
  rebuildBooths3D(true);
  linearise(scene); T3.linReady = true;
  homeView3D(false);
  const cv = renderer.domElement;
  let down = null, raf = 0;
  cv.addEventListener('pointerdown', ev=>{ down = { x: ev.clientX, y: ev.clientY }; T3.anim = null; });
  cv.addEventListener('pointermove', ev=>{
    if (ev.buttons){ tip.style.display = 'none'; return; }
    if (raf) return;
    raf = requestAnimationFrame(()=>{
      raf = 0;
      const id = pick3D(ev);
      const p = id ? T3.plots[id] : null;
      if (p !== T3.hover){ T3.hover = p; highlight3D(); }
      cv.style.cursor = id ? 'pointer' : 'grab';
      if (id){ showTip(tipHTML(BY[id]), ev); } else tip.style.display = 'none';
    });
  });
  cv.addEventListener('pointerleave', ()=>{ tip.style.display = 'none'; if (T3.hover){ T3.hover = null; highlight3D(); } });
  cv.addEventListener('pointerup', ev=>{
    if (!down) return; const moved = Math.abs(ev.clientX - down.x) + Math.abs(ev.clientY - down.y); down = null;
    if (moved > 5) return;
    const id = pick3D(ev);
    if (id){ focus3D(id); select(id); }
  });
  if (window.ResizeObserver) new ResizeObserver(resize3D).observe(el); else window.addEventListener('resize', resize3D);
  resize3D();
  loop3D();
}


/* ---------- team sign-in (shared online editor) ---------- */
function storedCode(){ try { return localStorage.getItem('fp27_code') || ''; } catch(e){ return ''; } }
async function checkCode(code){
  const res = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({key:code, action:'whoami'})});
  return res.json();
}
async function signIn(note){
  const saved = storedCode();
  if (saved && !note){ try { const r = await checkCode(saved); if (r && r.name) return signedIn(saved, r); } catch(e){} }
  const ov = document.createElement('div'); ov.className = 'login';
  ov.innerHTML = `<div class="lbox"><h2>Floorplan editor</h2><p>Enter your personal passcode to continue.</p><input id="lcode" type="password" autocomplete="current-password" placeholder="Passcode"><button class="btn primary" id="lgo">Sign in</button><div class="msg" id="lmsg">${esc(note||'')}</div></div>`;
  document.body.appendChild(ov);
  const go = async ()=>{
    const code = document.getElementById('lcode').value.trim(), m = document.getElementById('lmsg');
    if (!code) return; m.textContent = 'Checking...';
    try { const r = await checkCode(code); if (r && r.name){ try { localStorage.setItem('fp27_code', code); } catch(e){} ov.remove(); signedIn(code, r); } else m.textContent = 'That passcode was not recognised.'; }
    catch(e){ m.textContent = 'Could not reach the Google Sheet. Check your internet connection.'; }
  };
  document.getElementById('lgo').onclick = go;
  document.getElementById('lcode').onkeydown = ev=>{ if (ev.key === 'Enter') go(); };
  setTimeout(()=>document.getElementById('lcode').focus(), 50);
}
function signedIn(code, r){
  KEYV = code; ROLE = r.role === 'admin' ? 'admin' : 'sales'; USER = r.name;
  const h = document.querySelector('.hdr-right');
  if (h){
    let s = document.getElementById('who'); if (!s){ s = document.createElement('div'); s.id = 'who'; h.prepend(s); }
    s.innerHTML = 'Signed in as <b>' + esc(USER) + '</b> &middot; <a href="#" id="signout">Sign out</a>';
    document.getElementById('signout').onclick = ev=>{ ev.preventDefault(); try { localStorage.removeItem('fp27_code'); } catch(e){} KEYV = ''; s.remove(); signIn('You have signed out.'); };
  }
  selected = null; showSummary(); load();
}

render(); showSummary();
if (TEAM) signIn(); else load();
setView((window.innerWidth < 700 || !webglOK()) ? '2d' : '3d');
setInterval(()=>{ if (!editing) load(); }, Math.max(15, CONFIG.REFRESH_SECONDS) * 1000);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && !editing) load(); });
})();
</script>
